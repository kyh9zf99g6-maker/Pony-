<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Для моего пони-парня ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background-image: url('IMG_5780.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        /* Затемнение фона */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 182, 193, 0.15);
            backdrop-filter: blur(3px);
            z-index: 0;
        }

        /* ─── СЕТКА 2×2 (4 ОТДЕЛЬНЫХ БЛОКА) ─── */
        .grid-2x2 {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            max-width: 700px;
            width: 100%;
        }

        /* ─── КАЖДЫЙ БЛОК — ОТДЕЛЬНАЯ БЕЛАЯ КАРТОЧКА ─── */
        .block {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 30px 10px 30px 10px;
            padding: 20px 16px 22px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.20),
                        0 0 0 3px #f7b2c6,
                        0 0 0 6px #ffe0e8;
            text-align: center;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .block:hover {
            transform: scale(1.04) rotate(-1deg);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.30),
                        0 0 0 3px #f7b2c6,
                        0 0 0 6px #ffe0e8;
        }

        .block img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px 6px 20px 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            border: 3px solid white;
        }

        .block .caption {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a3a4a;
            line-height: 1.3;
        }

        .block .caption .emoji {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 2px;
        }

        .block .text-content {
            font-size: 1.1rem;
            color: #4a3a4a;
            line-height: 1.6;
            font-weight: 500;
            padding: 10px 0;
        }

        .block .text-content .big-emoji {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 6px;
        }

        /* ─── РАЗНЫЕ ЦВЕТА ДЛЯ КАЖДОГО БЛОКА ─── */
        .block:nth-child(1) { background: rgba(255, 232, 240, 0.95); }
        .block:nth-child(2) { background: rgba(252, 225, 168, 0.95); }
        .block:nth-child(3) { background: rgba(212, 234, 247, 0.95); }
        .block:nth-child(4) { background: rgba(216, 240, 216, 0.95); }

        /* ─── АДАПТАЦИЯ ─── */
        @media (max-width: 600px) {
            .grid-2x2 { gap: 16px; padding: 0 5px; }
            .block { padding: 14px 12px 16px; }
            .block .caption { font-size: 0.9rem; }
            .block .text-content { font-size: 0.9rem; }
            .block .text-content .big-emoji { font-size: 2rem; }
        }

        @media (max-width: 420px) {
            .grid-2x2 { gap: 10px; }
            .block { padding: 10px 8px 12px; border-radius: 20px 6px 20px 6px; }
            .block .caption { font-size: 0.75rem; }
            .block .text-content { font-size: 0.75rem; }
            .block .text-content .big-emoji { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- СЕТКА 2×2 — 4 ОТДЕЛЬНЫХ БЛОКА НА ФОНЕ -->
    <div class="grid-2x2">

        <!-- БЛОК 1 -->
        <div class="block">
            <img src="IMG_5599.jpeg" alt="Фото">
            <div class="caption">
                <span class="emoji">❤️</span>
                Наша история
            </div>
        </div>

        <!-- БЛОК 2 -->
        <div class="block">
            <img src="IMG_5606.jpeg" alt="Фото">
            <div class="caption">
                <span class="emoji">🦄</span>
                Ты и я
            </div>
        </div>

        <!-- БЛОК 3 -->
        <div class="block">
            <div class="text-content">
                <span class="big-emoji">💕</span>
                Ты делаешь меня<br>счастливой каждый день
            </div>
        </div>

        <!-- БЛОК 4 -->
        <div class="block">
            <img src="IMG_5595.jpeg" alt="Фото">
            <div class="caption">
                <span class="emoji">🌸</span>
                Наш мир
            </div>
        </div>

    </div>

</body>
</html>
