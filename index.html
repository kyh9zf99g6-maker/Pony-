<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Для моего пони-парня ✨</title>
    <style>
        /* ─── ОБНУЛЕНИЕ ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            /* ⭐ ФОН — ВАША КАРТИНКА ⭐ */
            background-image: url('IMG_5780.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        /* Тёмная полупрозрачная подложка, чтобы текст читался */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 182, 193, 0.25);
            backdrop-filter: blur(4px);
            z-index: 0;
        }

        /* ─── КАРТОЧКА ─── */
        .card {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 60px 60px 40px 40px;
            padding: 40px 35px 45px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3),
                        0 0 0 4px #f7b2c6,
                        0 0 0 8px #ffe0e8;
            text-align: center;
            transition: 0.4s;
        }

        .card:hover {
            transform: scale(1.01);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4),
                        0 0 0 4px #f7b2c6,
                        0 0 0 8px #ffe0e8;
        }

        /* ─── ЗАГОЛОВОК С РАДУГОЙ ─── */
        .pony-header {
            font-size: 2.8rem;
            font-weight: 900;
            color: #c44a6c;
            text-shadow: 3px 3px 0 #fce1a8, 6px 6px 0 #b5d9e8;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .pony-sub {
            font-size: 1.2rem;
            color: #8a6a7a;
            background: #ffe8f0;
            display: inline-block;
            padding: 6px 28px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: inset 0 -3px 0 #d9b0c0;
            margin-bottom: 20px;
        }

        /* ─── ИКОНКИ ПОНИ ─── */
        .pony-icons {
            font-size: 3rem;
            letter-spacing: 12px;
            margin: 6px 0 18px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ─── ГАЛЕРЕЯ ─── */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0 30px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 30px 10px 30px 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 4px solid white;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.08) rotate(-2deg);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            border-color: #f7b2c6;
        }

        /* ─── ТЕКСТ ЛЮБВИ ─── */
        .love-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #b3415a;
            background: linear-gradient(to right, #f7b2c6, #fce1a8, #b5d9e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0 5px;
        }

        .love-text span {
            -webkit-text-fill-color: initial;
            color: #c44a6c;
        }

        .footer-pony {
            margin-top: 20px;
            font-size: 1rem;
            color: #8a6a7a;
            background: #fff0f5;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 4px 0 #d9b0c0;
        }

        .footer-pony i {
            font-style: normal;
            animation: sparkle 1.2s infinite alternate;
        }

        @keyframes sparkle {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* ─── АДАПТАЦИЯ ПОД ТЕЛЕФОН ─── */
        @media (max-width: 600px) {
            .card { padding: 25px 18px; }
            .pony-header { font-size: 2rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .gallery img { border-radius: 20px 6px 20px 6px; }
            .pony-icons { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- 🦄 ШАПКА -->
        <div class="pony-icons">🦄🌈✨</div>
        <div class="pony-header">Для моего пони</div>
        <div class="pony-sub">❤️ Только для тебя ❤️</div>

        <!-- 📸 ГАЛЕРЕЯ (ваши фото) -->
        <div class="gallery">
            <img src="IMG_5599.jpeg" alt="Фото 1">
            <img src="IMG_5606.jpeg" alt="Фото 2">
            <img src="IMG_5595.jpeg" alt="Фото 3">
            <img src="IMG_5583.jpeg" alt="Фото 4">
            <img src="IMG_5581.jpeg" alt="Фото 5">
            <img src="IMG_5584.jpeg" alt="Фото 6">
            <img src="IMG_5588.jpeg" alt="Фото 7">
            <img src="IMG_5592.jpeg" alt="Фото 8">
            <img src="IMG_5590.jpeg" alt="Фото 9">
        </div>

        <!-- 💕 ТЕКСТ -->
        <div class="love-text">
            <span>💖</span> Ты мой самый лучший пони <span>💖</span>
        </div>
        <div style="font-size:1.1rem; color:#6a4a5a; margin-top:4px;">
            С тобой мир становится радужным ✨
        </div>

        <!-- 🦋 ПОДВАЛ -->
        <div class="footer-pony">
            <i>🌸</i> Сканируй QR — это наш секретный портал в Эквестрию <i>🌸</i>
        </div>

    </div>

</body>
</html>
